limit_req_zone $binary_remote_addr zone=homepage_limit:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name pentaworks.net www.pentaworks.net;

    return 301 https://pentaworks.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pentaworks.net;

    ssl_certificate /etc/letsencrypt/live/pentaworks.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pentaworks.net/privkey.pem;

    return 301 https://pentaworks.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pentaworks.net;

    ssl_certificate /etc/letsencrypt/live/pentaworks.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pentaworks.net/privkey.pem;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/health {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        limit_req zone=homepage_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

